<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In – StudyPilot</title>
  <meta name="description" content="Sign in to StudyPilot to organise your courses, upload your syllabus and manage study materials.">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<main class="auth-page">
  <!-- LEFT PANEL: branding + illustration -->
  <div class="auth-panel-left">
    <div class="auth-panel-left-logo">
      <!-- StudyPilot logo mark -->
      <svg width="28" height="28" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="32" height="32" rx="8" fill="#7548FF"/>
        <path d="M8 22L16 10L24 22" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M11 18H21" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="16" cy="10" r="2" fill="white"/>
      </svg>
      <span>StudyPilot</span>
    </div>

    <!-- Decorative illustration (CSS + inline SVG) -->
    <div class="auth-illustration" aria-hidden="true">
      <svg viewBox="0 0 280 260" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Desk surface -->
        <rect x="10" y="200" width="260" height="12" rx="6" fill="#C4B8FF" opacity=".6"/>
        <!-- Stack of books -->
        <rect x="30" y="155" width="70" height="14" rx="4" fill="#9B7FFF"/>
        <rect x="34" y="141" width="62" height="15" rx="4" fill="#7548FF"/>
        <rect x="28" y="169" width="76" height="14" rx="4" fill="#B8AAFF" opacity=".8"/>
        <!-- Laptop -->
        <rect x="110" y="140" width="110" height="62" rx="6" fill="#E8E3FF"/>
        <rect x="116" y="146" width="98" height="50" rx="4" fill="#D0C6FF"/>
        <!-- Screen glow lines -->
        <rect x="124" y="158" width="60" height="4" rx="2" fill="#7548FF" opacity=".4"/>
        <rect x="124" y="166" width="44" height="4" rx="2" fill="#7548FF" opacity=".3"/>
        <rect x="124" y="174" width="52" height="4" rx="2" fill="#7548FF" opacity=".25"/>
        <!-- Laptop base -->
        <rect x="104" y="200" width="122" height="8" rx="4" fill="#C4B8FF"/>
        <!-- Plant pot -->
        <rect x="224" y="178" width="30" height="24" rx="4" fill="#B8AAFF"/>
        <rect x="228" y="174" width="22" height="6" rx="3" fill="#9B7FFF"/>
        <!-- Plant stems -->
        <path d="M239 174 Q235 155 225 142" stroke="#5A9E6F" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M239 174 Q243 152 252 140" stroke="#5A9E6F" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M239 174 Q239 158 239 146" stroke="#5A9E6F" stroke-width="2.5" stroke-linecap="round"/>
        <!-- Leaves -->
        <ellipse cx="222" cy="139" rx="10" ry="6" fill="#6BBF84" transform="rotate(-30 222 139)"/>
        <ellipse cx="253" cy="137" rx="10" ry="6" fill="#5A9E6F" transform="rotate(25 253 137)"/>
        <ellipse cx="239" cy="142" rx="8" ry="5" fill="#7DD98F" transform="rotate(-5 239 142)"/>
        <!-- Pencil cup -->
        <rect x="55" y="158" width="20" height="28" rx="4" fill="#C4B8FF"/>
        <rect x="58" y="143" width="3" height="18" rx="1.5" fill="#9B7FFF"/>
        <rect x="63" y="140" width="3" height="21" rx="1.5" fill="#7548FF"/>
        <rect x="69" y="145" width="3" height="16" rx="1.5" fill="#B8AAFF"/>
      </svg>
    </div>

    <div class="auth-left-tagline">
      <h2>Your study space,<br>simplified.</h2>
      <p>Organise your courses, keep your materials together, and take the next step with confidence.</p>
    </div>
  </div>

  <!-- RIGHT PANEL: login form -->
  <div class="auth-panel-right">
    <div class="auth-form-box">
      <div class="flex items-center justify-between gap-12 mb-16">
        <h1 style="margin-bottom:0">Welcome back</h1>
        <div id="supabase-status-badge"></div>
      </div>
      <p class="auth-subtitle">Sign in to your StudyPilot account.</p>

      <!-- Pending-integration message -->
      <div id="login-msg" class="auth-info-box" style="display:none; margin-bottom:16px"></div>

      <form id="login-form" class="auth-form" novalidate>

        <!-- Email -->
        <div class="form-group">
          <label class="form-label" for="login-email">Email</label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><polyline points="2,4 12,13 22,4"/></svg>
            </span>
            <input id="login-email" class="form-input" type="email" placeholder="you@example.com"
                   autocomplete="email" required aria-required="true"
                   aria-describedby="login-email-error">
          </div>
          <span id="login-email-error" class="field-error" style="display:none" role="alert"></span>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </span>
            <input id="login-password" class="form-input" type="password" placeholder="Enter your password"
                   autocomplete="current-password" required aria-required="true"
                   aria-describedby="login-password-error">
            <button type="button" class="input-action" data-toggle-pw="login-password"
                    aria-label="Show password">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <span id="login-password-error" class="field-error" style="display:none" role="alert"></span>
        </div>

        <!-- Forgot password -->
        <div class="auth-extras">
          <a href="forgot-password.html">Forgot password?</a>
        </div>

        <!-- Submit -->
        <button type="submit" class="btn btn-primary w-full" style="justify-content:center; padding:12px">
          Sign in
        </button>
      </form>

      <div class="auth-footer">
        New here? <a href="register.html">Create account</a>
      </div>

      <!-- Preview workspace link -->
      <div class="auth-preview-link">
        Just exploring? <a href="#" id="preview-btn">Preview workspace →</a>
      </div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/common.js"></script>
<script src="js/storage.js"></script>
<script src="js/auth-preview.js"></script>
</body>
</html>
