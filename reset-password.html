<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password – StudyPilot</title>
  <meta name="description" content="Set a new password for your StudyPilot account.">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<main class="auth-page">
  <div class="auth-panel-left">
    <div class="auth-panel-left-logo">
      <svg width="28" height="28" viewBox="0 0 32 32" fill="none"><rect width="32" height="32" rx="8" fill="#7548FF"/><path d="M8 22L16 10L24 22" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M11 18H21" stroke="white" stroke-width="2.5" stroke-linecap="round"/><circle cx="16" cy="10" r="2" fill="white"/></svg>
      <span>StudyPilot</span>
    </div>
    <div class="auth-illustration" aria-hidden="true">
      <svg viewBox="0 0 280 220" fill="none">
        <rect x="10" y="180" width="260" height="10" rx="5" fill="#C4B8FF" opacity=".5"/>
        <rect x="70" y="120" width="140" height="62" rx="8" fill="#E8E3FF"/>
        <rect x="78" y="128" width="124" height="46" rx="5" fill="#D0C6FF"/>
        <rect x="90" y="140" width="70" height="5" rx="2.5" fill="#7548FF" opacity=".5"/>
        <rect x="90" y="152" width="50" height="5" rx="2.5" fill="#9B7FFF" opacity=".4"/>
        <rect x="62" y="180" width="156" height="8" rx="4" fill="#C4B8FF"/>
        <rect x="35" y="145" width="30" height="36" rx="4" fill="#9B7FFF"/>
        <rect x="38" y="140" width="24" height="8" rx="4" fill="#7548FF"/>
        <rect x="215" y="150" width="28" height="30" rx="4" fill="#B8AAFF"/>
        <path d="M229 150 Q225 132 215 118" stroke="#5A9E6F" stroke-width="2" stroke-linecap="round"/>
        <ellipse cx="213" cy="115" rx="9" ry="5.5" fill="#6BBF84" transform="rotate(-20 213 115)"/>
        <path d="M229 150 Q234 133 243 120" stroke="#5A9E6F" stroke-width="2" stroke-linecap="round"/>
        <ellipse cx="245" cy="117" rx="9" ry="5.5" fill="#5A9E6F" transform="rotate(20 245 117)"/>
      </svg>
    </div>
    <div class="auth-left-tagline">
      <h2>Your study space,<br>simplified.</h2>
      <p>All your courses and materials in one place.</p>
    </div>
  </div>

  <div class="auth-panel-right">
    <div class="auth-form-box" style="max-width:340px">

      <div class="auth-icon-box" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </div>

      <h1 style="text-align:center">Set a new password</h1>
      <p class="auth-subtitle" style="text-align:center">Choose a new password for your account.</p>

      <div id="reset-msg" class="auth-info-box" style="display:none; margin-bottom:16px"></div>

      <form id="reset-form" class="auth-form" novalidate>

        <div class="form-group">
          <label class="form-label" for="reset-password">New password</label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </span>
            <input id="reset-password" class="form-input" type="password" placeholder="Create a new password"
                   autocomplete="new-password" required aria-required="true"
                   aria-describedby="reset-password-error reset-pw-hint">
            <button type="button" class="input-action" data-toggle-pw="reset-password" aria-label="Show password">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <span id="reset-pw-hint" class="text-xs text-secondary">At least 8 characters.</span>
          <span id="reset-password-error" class="field-error" style="display:none" role="alert"></span>
        </div>

        <div class="form-group">
          <label class="form-label" for="reset-confirm">Confirm new password</label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </span>
            <input id="reset-confirm" class="form-input" type="password" placeholder="Confirm your new password"
                   autocomplete="new-password" required aria-required="true"
                   aria-describedby="reset-confirm-error">
            <button type="button" class="input-action" data-toggle-pw="reset-confirm" aria-label="Show password">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <span id="reset-confirm-error" class="field-error" style="display:none" role="alert"></span>
        </div>

        <button type="submit" class="btn btn-primary w-full" style="justify-content:center; padding:12px">
          Save new password
        </button>
      </form>

      <div class="auth-footer">
        <a href="login.html">← Back to sign in</a>
      </div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/common.js"></script>
<script src="js/storage.js"></script>
<script src="js/auth-preview.js"></script>
</body>
</html>
