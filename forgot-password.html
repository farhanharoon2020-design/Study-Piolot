<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password – StudyPilot</title>
  <meta name="description" content="Reset your StudyPilot password.">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<main class="auth-page">
  <!-- LEFT PANEL (compact illustration) -->
  <div class="auth-panel-left">
    <div class="auth-panel-left-logo">
      <svg width="28" height="28" viewBox="0 0 32 32" fill="none"><rect width="32" height="32" rx="8" fill="#7548FF"/><path d="M8 22L16 10L24 22" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M11 18H21" stroke="white" stroke-width="2.5" stroke-linecap="round"/><circle cx="16" cy="10" r="2" fill="white"/></svg>
      <span>StudyPilot</span>
    </div>
    <div class="auth-illustration" aria-hidden="true">
      <svg viewBox="0 0 280 220" fill="none">
        <rect x="10" y="180" width="260" height="10" rx="5" fill="#C4B8FF" opacity=".5"/>
        <rect x="60" y="130" width="160" height="52" rx="8" fill="#E8E3FF"/>
        <rect x="68" y="138" width="144" height="38" rx="5" fill="#D0C6FF"/>
        <rect x="80" y="148" width="80" height="5" rx="2.5" fill="#7548FF" opacity=".5"/>
        <rect x="80" y="158" width="60" height="5" rx="2.5" fill="#9B7FFF" opacity=".4"/>
        <rect x="54" y="180" width="172" height="8" rx="4" fill="#C4B8FF"/>
        <rect x="40" y="145" width="18" height="36" rx="4" fill="#9B7FFF"/>
        <rect x="22" y="157" width="18" height="24" rx="4" fill="#7548FF"/>
        <rect x="222" y="155" width="26" height="22" rx="4" fill="#B8AAFF"/>
        <rect x="226" y="151" width="18" height="6" rx="3" fill="#9B7FFF"/>
        <path d="M235 151 Q232 138 224 128" stroke="#5A9E6F" stroke-width="2" stroke-linecap="round"/>
        <path d="M235 151 Q238 136 246 126" stroke="#5A9E6F" stroke-width="2" stroke-linecap="round"/>
        <ellipse cx="221" cy="125" rx="8" ry="5" fill="#6BBF84" transform="rotate(-20 221 125)"/>
        <ellipse cx="248" cy="123" rx="8" ry="5" fill="#5A9E6F" transform="rotate(20 248 123)"/>
      </svg>
    </div>
    <div class="auth-left-tagline">
      <h2>Your study space,<br>simplified.</h2>
      <p>Organise your courses and materials with ease.</p>
    </div>
  </div>

  <!-- RIGHT PANEL -->
  <div class="auth-panel-right">
    <div class="auth-form-box" style="max-width:340px">

      <div class="auth-icon-box" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><polyline points="2,4 12,13 22,4"/></svg>
      </div>

      <div style="display:flex; justify-content:center; margin-bottom:12px">
        <div id="supabase-status-badge"></div>
      </div>

      <h1 style="text-align:center">Forgot your password?</h1>
      <p class="auth-subtitle" style="text-align:center">Enter your email and we will send a reset link.</p>

      <div id="forgot-msg" class="auth-info-box" style="display:none; margin-bottom:16px"></div>

      <form id="forgot-form" class="auth-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="forgot-email">Email</label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><polyline points="2,4 12,13 22,4"/></svg>
            </span>
            <input id="forgot-email" class="form-input" type="email" placeholder="you@example.com"
                   autocomplete="email" required aria-required="true"
                   aria-describedby="forgot-email-error">
          </div>
          <span id="forgot-email-error" class="field-error" style="display:none" role="alert"></span>
        </div>

        <button type="submit" class="btn btn-primary w-full" style="justify-content:center; padding:12px">
          Send reset link
        </button>
      </form>

      <div class="auth-footer">
        <a href="login.html">← Back to sign in</a>
      </div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/common.js"></script>
<script src="js/storage.js"></script>
<script src="js/auth-preview.js"></script>
</body>
</html>
